services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsbrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsbrief_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-opsbrief}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-opsbrief} -d ${POSTGRES_DB:-opsbrief}
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsbrief}:${POSTGRES_PASSWORD:-opsbrief_dev_password}@database:5432/${POSTGRES_DB:-opsbrief}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Riyadh}
      OPSBRIEF_API_KEY: "${OPSBRIEF_API_KEY:?OPSBRIEF_API_KEY must be set}"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: