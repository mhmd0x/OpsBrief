services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsbrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsbrief_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-opsbrief}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-opsbrief} -d ${POSTGRES_DB:-opsbrief}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: