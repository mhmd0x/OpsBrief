services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsbrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-opsbrief}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-opsbrief} -d ${POSTGRES_DB:-opsbrief}
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV must be set to local, test, or production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsbrief}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@database:5432/${POSTGRES_DB:-opsbrief}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Riyadh}
      OPSBRIEF_API_KEY: "${OPSBRIEF_API_KEY:?OPSBRIEF_API_KEY must be set}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: